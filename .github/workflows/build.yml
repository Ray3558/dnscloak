name: Build DNSCloak IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app

    - name: Build
      run: |
        xcodebuild \
        -project DNSCloak.xcodeproj \
        -scheme DNSCloak \
        -configuration Release \
        -sdk iphoneos \
        -archivePath build/DNSCloak.xcarchive \
        CODE_SIGNING_ALLOWED=NO \
        archive

    - name: Export IPA
      run: |
        mkdir Payload
        cp -r build/DNSCloak.xcarchive/Products/Applications/*.app Payload/
        zip -r DNSCloak.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DNSCloak
        path: DNSCloak.ipa
