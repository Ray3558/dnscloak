name: Build DNSCloak iOS Test

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 12
          architecture: x64

      - name: Show Node version
        run: |
          node -v
          npm -v

      - name: Install npm dependencies
        run: |
          npm install --ignore-scripts

      - name: Install Cordova
        run: |
          npm install -g cordova@8

      - name: Show Cordova version
        run: |
          cordova -v

      - name: Verify Cordova project
        run: |
          pwd
          ls -la

          test -f config.xml
          test -d platforms
          test -d plugins

          echo "Cordova project detected"

      - name: Prepare iOS project
        run: |
          cordova prepare ios

      - name: Check Xcode project
        run: |
          find platforms/ios -name "*.xcodeproj"
          find platforms/ios -name "*.xcworkspace"

      - name: List Xcode schemes
        run: |
          cd platforms/ios

          xcodebuild \
            -list \
            -project DNSCryptApp.xcodeproj

      - name: Build iOS Debug without signing
        run: |
          cd platforms/ios

          xcodebuild \
            -project DNSCryptApp.xcodeproj \
            -scheme DNSCryptApp \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check Deployment Target
        run: |
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" . || true

      - name: Check Swift Version
        run: |
          grep -R "SWIFT_VERSION" . || true
