name: Debug DNSCloak Framework

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version


      - name: Show project structure
        run: |
          pwd
          echo "===== ROOT ====="
          ls -la

          echo "===== platforms/ios ====="
          ls -la platforms/ios


      - name: Search dnscrypt files
        run: |
          echo "===== dnscrypt ====="

          find . \
          \( -iname "*dnscrypt*" \
          -o -iname "*Dnscrypt*" \
          -o -iname "*libdns*" \) \
          -print || true


      - name: Search framework
        run: |
          echo "===== Framework ====="

          find . \
          -type d \
          -name "*.framework" \
          -print || true


      - name: Search header
        run: |
          echo "===== Header ====="

          find . \
          -name "Dnscryptproxy.h" \
          -print || true


      - name: Check Xcode reference
        run: |
          echo "===== Xcode reference ====="

          grep -R "Dnscryptproxy" \
          platforms/ios/DNSCryptApp.xcodeproj \
          || true


      - name: Check build scripts
        run: |
          echo "===== scripts ====="

          find . \
          -maxdepth 3 \
          -type f \
          \( -name "*.sh" -o -name "*.mk" -o -name "Makefile" \) \
          -print || true


      - name: Fix Deployment Target
        run: |
          find platforms/ios \
          -name "*.pbxproj" \
          -exec sed -i '' \
          's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' {} \;


      - name: Build iOS
        continue-on-error: true
        run: |
          cd platforms/ios

          xcodebuild \
          -project DNSCryptApp.xcodeproj \
          -scheme DNSCryptApp \
          -configuration Debug \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -verbose \
          2>&1 | tee build.log


      - name: Show errors
        run: |
          echo "===== Errors ====="

          grep -i -A10 -B10 \
          "error:" \
          platforms/ios/build.log || true


      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: dnscloak-debug
          path: platforms/ios/build.log
