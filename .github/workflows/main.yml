name: Debug DNSCloak iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version


      - name: Show project
        run: |
          pwd
          ls -la
          ls -la platforms/ios


      - name: Fix iOS Deployment Target
        run: |
          echo "Before:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true

          find platforms/ios \
            -name "*.pbxproj" \
            -exec sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' {} \;

          echo "After:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true


      - name: Check Scheme
        run: |
          cd platforms/ios

          xcodebuild \
            -list \
            -project DNSCryptApp.xcodeproj


      - name: Show DNSCryptThread source
        run: |
          echo "===== DNSCryptThread.m ====="

          sed -n '1,260p' \
          platforms/ios/DNSCryptAppExt/DNSCryptThread.m || true


      - name: Build with full log
        continue-on-error: true
        run: |
          cd platforms/ios

          xcodebuild \
            -project DNSCryptApp.xcodeproj \
            -scheme DNSCryptApp \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -verbose \
            2>&1 | tee build.log


      - name: Extract errors
        run: |
          echo "========== ERROR =========="

          grep -i -A15 -B15 "error:" \
          platforms/ios/build.log || true


          echo "========== DNSCryptThread =========="

          grep -i -A10 -B10 "DNSCryptThread" \
          platforms/ios/build.log || true


          echo "========== FAILED COMMAND =========="

          grep -i "CompileC" \
          platforms/ios/build.log || true


      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: DNSCryptApp-debug-log
          path: platforms/ios/build.log
