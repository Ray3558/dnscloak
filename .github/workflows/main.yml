name: Find Dnscryptproxy Build Source

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: macos-14

    steps:

      - name: TEST NEW YAML
        run: |
          echo "=========================="
          echo "FIND DNSCRYPT BUILD SOURCE"
          echo "=========================="


      - name: Checkout source
        uses: actions/checkout@v4


      - name: Show repository
        run: |
          pwd
          ls -la


      - name: Search build directory
        run: |
          echo "===== build directory ====="

          find build \
          -maxdepth 5 \
          -type f \
          -print || true


      - name: Search scripts
        run: |
          echo "===== scripts ====="

          find . \
          \( \
          -name "*.sh" \
          -o -name "Makefile" \
          -o -name "*.mk" \
          -o -name "*.py" \
          \) \
          -print || true


      - name: Search dnscrypt source
        run: |
          echo "===== dnscrypt source ====="

          find . \
          \( \
          -iname "*dnscrypt*" \
          -o -iname "*libdns*" \
          -o -iname "*proxy*" \
          \) \
          -print || true


      - name: Check git tracked files
        run: |
          echo "===== git files ====="

          git ls-files | grep -Ei \
          "dnscrypt|framework|build|script|make" \
          || true


      - name: Search Xcode reference
        run: |
          echo "===== xcode reference ====="

          grep -R "Dnscryptproxy" \
          platforms/ios \
          || true
