name: Test Build Environment

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Check project
        run: |
          ls -la
          find . -name "*.xcodeproj"
          find . -name "*.xcworkspace"

      - name: Xcode info
        run: |
          xcodebuild -list
