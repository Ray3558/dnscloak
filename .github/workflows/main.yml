name: Build DNSCloak iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version


      - name: Show project
        run: |
          pwd
          ls -la
          ls -la platforms/ios


      - name: Install Node dependencies
        run: |
          npm install --ignore-scripts || true


      - name: Check Xcode project
        run: |
          cd platforms/ios

          xcodebuild \
            -list \
            -project DNSCryptApp.xcodeproj


      - name: Fix iOS Deployment Target
        run: |
          echo "Before:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true

          find platforms/ios \
            -name "*.pbxproj" \
            -exec sed -i '' \
            's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' {} \;

          echo "After:"
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true


      - name: Show Migrator source
        run: |
          echo "===== Migrator.m ====="
          sed -n '1,240p' platforms/ios/DNSCryptApp/Migrator.m || true


      - name: Build iOS Debug without signing
        continue-on-error: true
        run: |
          cd platforms/ios

          xcodebuild \
            -project DNSCryptApp.xcodeproj \
            -scheme DNSCryptApp \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -verbose \
            2>&1 | tee build.log


      - name: Extract errors
        run: |
          echo "===== BUILD ERRORS ====="

          grep -n "error:" platforms/ios/build.log || true

          echo ""
          echo "===== FAILED COMMANDS ====="

          grep -n "CompileC\|SwiftCompile\|Ld " platforms/ios/build.log || true


      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: DNSCryptApp-Xcode-build-log
          path: platforms/ios/build.log
