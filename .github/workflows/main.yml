name: Test Build Environment

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show macOS version
        run: |
          sw_vers

      - name: Show Xcode versions
        run: |
          ls -1 /Applications | grep Xcode || true
          xcodebuild -version

      - name: Check project files
        run: |
          echo "=== Xcode Projects ==="
          find . -name "*.xcodeproj"

          echo "=== Xcode Workspaces ==="
          find . -name "*.xcworkspace"

      - name: List Xcode schemes
        run: |
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -n "$PROJECT" ]; then
            echo "Using project:"
            echo "$PROJECT"

            xcodebuild -list -project "$PROJECT"
          else
            echo "No xcodeproj found"
          fi

      - name: Check Deployment Target
        run: |
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" . || true

      - name: Check Swift version
        run: |
          grep -R "SWIFT_VERSION" . || true
