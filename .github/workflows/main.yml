name: Test DNSCloak Cordova Build

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Install dependencies
        run: |
          npm install

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Prepare iOS project
        run: |
          cordova prepare ios

      - name: List Xcode project
        run: |
          cd platforms/ios
          xcodebuild -list -project DNSCryptApp.xcodeproj

      - name: Check Deployment Target
        run: |
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true

      - name: Check Swift Version
        run: |
          grep -R "SWIFT_VERSION" platforms/ios || true
