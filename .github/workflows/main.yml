name: Test New Workflow

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-14

    steps:

      - name: TEST NEW YAML
        run: |
          echo "=========================="
          echo "THIS IS NEW YAML"
          echo "=========================="


      - name: Checkout source
        uses: actions/checkout@v4


      - name: Show repository
        run: |
          echo "Current directory:"
          pwd

          echo "Files:"
          ls -la


      - name: Search dnscrypt
        run: |
          echo "===== Search dnscrypt ====="

          find . \
          \( -iname "*dnscrypt*" -o -iname "*Dnscrypt*" \) \
          -print || true


      - name: Search Dnscryptproxy header
        run: |
          echo "===== Search header ====="

          find . \
          -name "Dnscryptproxy.h" \
          -print || true


      - name: Search framework
        run: |
          echo "===== Search framework ====="

          find . \
          -name "*.framework" \
          -print || true
