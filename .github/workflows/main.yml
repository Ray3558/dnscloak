name: Diagnose Dnscryptproxy

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-14

    steps:

      - name: TEST NEW YAML
        run: |
          echo "=========================="
          echo "DNSCRYPT DIAGNOSTIC"
          echo "=========================="


      - name: Checkout source
        uses: actions/checkout@v4


      - name: Show repository
        run: |
          echo "===== PWD ====="
          pwd

          echo "===== ROOT ====="
          ls -la


      - name: Search dnscrypt files
        run: |
          echo "===== DNSCRYPT FILES ====="

          find . \
          \( \
          -iname "*dnscrypt*" \
          -o -iname "*Dnscrypt*" \
          -o -iname "*libdns*" \
          -o -iname "*proxy*" \
          \) \
          -print || true


      - name: Search headers
        run: |
          echo "===== HEADERS ====="

          find . \
          \( \
          -name "*.h" \
          -o -name "*.hpp" \
          \) \
          | grep -Ei "dns|proxy|crypt" \
          || true


      - name: Search frameworks
        run: |
          echo "===== FRAMEWORKS ====="

          find . \
          -name "*.framework" \
          -print || true


      - name: Check frameworks json
        run: |
          echo "===== frameworks.json ====="

          if [ -f platforms/ios/frameworks.json ]; then
            cat platforms/ios/frameworks.json
          else
            echo "frameworks.json not found"
          fi


      - name: Check Xcode references
        run: |
          echo "===== XCODE REFERENCES ====="

          grep -R "Dnscryptproxy" \
          platforms/ios \
          || true


      - name: Check git tracked files
        run: |
          echo "===== GIT TRACKED ====="

          git ls-files \
          | grep -Ei \
          "dnscrypt|proxy|framework|libdns|make|script" \
          || true
