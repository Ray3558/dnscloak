name: Debug DNSCloak iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version


      - name: Show files
        run: |
          pwd
          ls -la


      - name: Check Dnscryptproxy framework
        run: |
          echo "===== Search Dnscryptproxy.h ====="

          find . \
          \( -name "Dnscryptproxy.h" -o -name "Dnscryptproxy.framework" \) \
          -print || true


          echo "===== Framework directory ====="

          find . -maxdepth 4 \
          -type d \
          -name "*framework" \
          -print || true


      - name: Fix Deployment Target
        run: |
          find platforms/ios \
          -name "*.pbxproj" \
          -exec sed -i '' \
          's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' {} \;


      - name: Build
        continue-on-error: true
        run: |
          cd platforms/ios

          xcodebuild \
            -project DNSCryptApp.xcodeproj \
            -scheme DNSCryptApp \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -verbose \
            2>&1 | tee build.log


      - name: Show Dnscryptproxy error
        run: |
          echo "===== ERROR ====="

          grep -i -A10 -B10 \
          "Dnscryptproxy" \
          platforms/ios/build.log || true


      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: dnscloak-build-log
          path: platforms/ios/build.log
