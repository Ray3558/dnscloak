name: Debug DNSCloak iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version


      - name: Show project files
        run: |
          pwd
          ls -la
          echo "===== platforms ====="
          ls -la platforms || true


      - name: Search Dnscryptproxy
        run: |
          echo "===== Search dnscrypt ====="

          find . \
          \( -iname "*dnscrypt*" -o -iname "*Dnscrypt*" \) \
          -print || true


          echo "===== Search header ====="

          find . \
          -name "Dnscryptproxy.h" \
          -print || true


      - name: Fix Deployment Target
        run: |
          find platforms/ios \
          -name "*.pbxproj" \
          -exec sed -i '' \
          's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' {} \;


      - name: Check Xcode project
        run: |
          cd platforms/ios

          xcodebuild \
          -list \
          -project DNSCryptApp.xcodeproj


      - name: Build iOS Debug
        continue-on-error: true
        run: |
          cd platforms/ios

          xcodebuild \
          -project DNSCryptApp.xcodeproj \
          -scheme DNSCryptApp \
          -configuration Debug \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          -verbose \
          2>&1 | tee build.log


      - name: Extract error
        run: |
          echo "===== ERROR MESSAGE ====="

          grep -i -A10 -B10 \
          "error:" \
          platforms/ios/build.log || true


          echo "===== Dnscryptproxy ====="

          grep -i -A10 -B10 \
          "Dnscryptproxy" \
          platforms/ios/build.log || true


      - name: Upload log
        uses: actions/upload-artifact@v4
        with:
          name: DNSCloak-debug-log
          path: platforms/ios/build.log
