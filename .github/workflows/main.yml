name: Test DNSCloak Old Cordova Build

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: macos-12

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Setup Node.js 12 x64
        uses: actions/setup-node@v4
        with:
          node-version: 12
          architecture: x64

      - name: Show Node version
        run: |
          node -v
          npm -v

      - name: Install Python 2
        run: |
          brew install python@2 || true
          python2 --version || true

      - name: Configure npm for old node-gyp
        run: |
          npm config set python python2 || true

      - name: Install npm dependencies
        run: |
          npm install

      - name: Install Cordova
        run: |
          npm install -g cordova

      - name: Show Cordova version
        run: |
          cordova -v

      - name: Prepare iOS project
        run: |
          cordova prepare ios

      - name: Check Xcode project
        run: |
          find platforms/ios -name "*.xcodeproj"
          find platforms/ios -name "*.xcworkspace"

      - name: List Xcode schemes
        run: |
          cd platforms/ios
          xcodebuild -list -project DNSCryptApp.xcodeproj

      - name: Check Deployment Target
        run: |
          grep -R "IPHONEOS_DEPLOYMENT_TARGET" platforms/ios || true

      - name: Check Swift Version
        run: |
          grep -R "SWIFT_VERSION" platforms/ios || true
